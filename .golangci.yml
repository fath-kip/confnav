version: "2"

linters:
  settings:
    errcheck:
      # Best-effort cleanup and terminal output; failures there are not actionable.
      exclude-functions:
        - (*os.File).Close
        - os.Remove
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
  exclusions:
    rules:
      # Test setup errors surface as failing assertions anyway.
      - path: _test\.go
        linters: [errcheck]
