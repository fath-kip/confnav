# Built-in catalog of configuration files.
#
# Each [[category]] becomes a top-level folder. Entry fields:
#   name     short label (usually the file name)
#   desc     one-line description
#   path     absolute path; ~ and $XDG_CONFIG_HOME are expanded
#   kind     "file" (default), "dir" (expands to its contents) or "glob"
#   distros  families the entry applies to; omitted = all of arch, debian, fedora
#   hint     reminder shown after the file is edited (never executed)
#   hints    per-family hint overriding `hint`, e.g. { debian = "sudo update-grub" }
#   defaults vendor copy used when the file does not exist yet (Fedora ships
#            systemd's *.conf only in /usr/lib); confnav offers to start from it
#
# The ID of an entry is "<category id>:<path>", so changing a path or moving an
# entry to another category un-hides it for users who hid it.

[[category]]
